<style>
:root{
  --ink:#0F1012;--ink2:#6B6F76;--ink3:#9AA0A6;--line:#E8EAED;--tonal:#F3F4F5;--tonal2:#F7F8F9;
  --brand:#007C0B;--brandbg:#F1F8F2;--blue:#2653D9;--bluebg:#F2F5FE;
  --warn:#8A5A00;--warnbg:#FFF6E5;--bad:#B4402E;--badbg:#FCEEEB;
  --r:12px;--rc:14px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#fff;color:var(--ink);
  font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain}
.app{min-height:100%;display:flex;flex-direction:column}

/* nav */
nav{position:sticky;top:0;z-index:20;background:#fff;padding:calc(8px + var(--safe-t)) 14px 8px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
nav .back{width:30px;height:30px;border-radius:50%;background:var(--tonal);border:none;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
nav .back s{display:block;width:8px;height:8px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:rotate(45deg);margin-left:3px;text-decoration:none}
nav .ttl{font-size:14px;font-weight:800;letter-spacing:-0.02em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .gear{margin-left:auto;background:none;border:none;font-size:17px;cursor:pointer;padding:4px;color:var(--ink2)}

main{flex:1;padding:14px 16px calc(20px + var(--safe-b));display:flex;flex-direction:column;gap:12px;max-width:640px;width:100%;margin:0 auto}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
h1{font-size:23px;font-weight:800;letter-spacing:-0.035em;line-height:1.12;margin:0}
h2{font-size:16px;font-weight:800;letter-spacing:-0.025em;margin:0}
p{margin:0}
.note{font-size:12.5px;color:var(--ink2);line-height:1.5}
.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.02em;word-break:break-word}

input,select,textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--r);background:#fff;color:var(--ink);outline:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--ink)}
textarea{min-height:76px;resize:vertical;font-size:14px}
button{font:inherit;font-weight:700;font-size:15px;border:none;border-radius:var(--r);
  padding:14px 16px;background:var(--tonal);color:var(--ink);cursor:pointer;line-height:1.1}
button.primary{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(0,124,11,.25)}
button.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2)}
button:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

label.file{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:var(--tonal2);border:1.5px dashed #D3D7DB;border-radius:var(--rc);padding:22px 16px;cursor:pointer}
label.file b{font-size:15px}label.file span{font-size:12.5px;color:var(--ink2);text-align:center}
label.file input{display:none}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shots figure{margin:0;position:relative}
.shots img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.shots button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;padding:0;border-radius:50%;
  background:var(--ink);color:#fff;font-size:12px;line-height:22px;box-shadow:none}

.card{background:#fff;border-radius:var(--rc);padding:12px 14px;display:flex;flex-direction:column;gap:4px;
  box-shadow:0 1px 2px rgba(16,18,20,.05),0 6px 16px -8px rgba(16,18,20,.14)}
.card.tonal{background:var(--tonal2);box-shadow:none}
.card.win{background:var(--brandbg);box-shadow:inset 0 0 0 1.5px var(--brand)}
.card.pick{background:var(--bluebg);box-shadow:inset 0 0 0 1.5px var(--blue)}
.card.mute{background:var(--tonal2);box-shadow:none;opacity:.6}
.card .t{font-size:14px;font-weight:800;letter-spacing:-0.02em;display:flex;gap:8px;align-items:center}
.card .s{font-size:12.5px;color:var(--ink2);line-height:1.45}
.card .px{margin-left:auto;font-weight:800;white-space:nowrap}
.tap{cursor:pointer}
.tap:active{transform:scale(.995)}

.pill{display:inline-flex;align-items:center;gap:5px;background:var(--tonal);border-radius:999px;
  padding:5px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.brand{background:#E8F3E9;color:#00650a}.pill.blue{background:var(--bluebg);color:var(--blue)}
.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.pills{display:flex;gap:6px;flex-wrap:wrap}

.rel{display:flex;gap:12px;align-items:flex-start}
.rel img{width:74px;height:74px;flex:none;border-radius:10px;object-fit:cover;background:var(--tonal);
  box-shadow:0 1px 2px rgba(16,18,20,.08),0 8px 20px -10px rgba(16,18,20,.25)}
.rel .m{min-width:0;display:flex;flex-direction:column;gap:3px}
.rel .a{font-size:12.5px;font-weight:700;color:var(--blue)}
.rel .b{font-size:15px;font-weight:800;letter-spacing:-0.025em;line-height:1.18}
.rel .c{font-size:12px;color:var(--ink2)}

.stats{display:flex;background:var(--tonal2);border-radius:var(--rc);padding:11px 4px}
.stats div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.stats .k{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.stats .n{font-size:14px;font-weight:800;letter-spacing:-0.02em}

.meter{height:6px;background:#F0F1F3;border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .5s ease}
.kv{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.kv .k{color:var(--ink2);font-weight:600}.kv .n{font-weight:800;letter-spacing:-0.02em}

.banner{border-radius:var(--r);padding:12px 14px;font-size:13px;font-weight:600;line-height:1.45}
.banner.bad{background:var(--badbg);color:var(--bad)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.banner.info{background:var(--tonal2);color:var(--ink2)}
.hidden{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.14);border-top-color:var(--ink);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--ink2)}
details{border:1px solid var(--line);border-radius:var(--r)}
summary{padding:12px 14px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer}
details>div{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.sticky{position:sticky;bottom:0;background:linear-gradient(to top,#fff 68%,rgba(255,255,255,0));
  padding:12px 0 calc(4px + var(--safe-b));margin-top:auto;display:flex;gap:8px}
.sticky>*{flex:1}
a{color:var(--blue)}

/* live scanner */
.viewport{position:relative;border-radius:var(--rc);overflow:hidden;background:#0B0C0D;aspect-ratio:3/4}
.viewport video{width:100%;height:100%;object-fit:cover;display:block}
.vp-overlay{position:absolute;inset:0;pointer-events:none}
.reticle{position:absolute;border:2px solid rgba(255,255,255,.92);border-radius:10px;
  box-shadow:0 0 0 2000px rgba(0,0,0,.34);transition:all .35s ease}
.reticle.sq{inset:14% 8% auto 8%;aspect-ratio:1/1}
.reticle.ring{inset:12% 14%;border-radius:50%;aspect-ratio:1/1}
.reticle.on{border-color:#3ddc84;box-shadow:0 0 0 2000px rgba(0,0,0,.34),0 0 14px rgba(61,220,132,.7)}
.vp-hint{position:absolute;left:0;right:0;bottom:0;padding:12px 14px 14px;color:#fff;max-height:4.4em;overflow:hidden;
  background:linear-gradient(to top,rgba(0,0,0,.72),transparent);font-size:13px;font-weight:600;line-height:1.4;text-align:center}
.vp-top{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;gap:8px;align-items:center;
  background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent)}
.vp-step{color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.vp-live{margin-left:auto;display:flex;align-items:center;gap:5px;color:#fff;font-size:10.5px;font-weight:700}
.vp-live i{width:7px;height:7px;border-radius:50%;background:#3ddc84;display:block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.vp-busy{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:12px;font-weight:700;background:rgba(0,0,0,.62);padding:8px 14px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(2px)}
.checks{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--rc);overflow:hidden}
.checks div{background:#fff;padding:11px 13px;display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700}
.checks div.done{background:var(--brandbg)}
.checks div.now{background:var(--warnbg)}
.checks b{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;background:var(--tonal);color:var(--ink3)}
.checks div.done b{background:var(--brand);color:#fff}
.checks div.now b{background:var(--warn);color:#fff}
.checks span{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink2);text-align:right;max-width:52%}
.shutter{width:64px;height:64px;border-radius:50%;background:#fff;border:4px solid var(--ink);padding:0;margin:0 auto;display:block}
</style>

<div class="app">
  <nav>
    <button class="back hidden" id="back" aria-label="Back"><s></s></button>
    <span class="ttl" id="title">Runout</span>
    <button class="gear" id="gear" aria-label="Settings">&#9881;</button>
  </nav>
  <main id="main"></main>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const LS = localStorage;
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = t => (t == null ? '' : String(t)).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const S = {                       // app state
  screen: 'search', stack: [],
  query: '', results: [], album: null,
  versions: [], country: '', fmt: 'vinyl', cap: 14, candidates: [],
  shots: [], match: null, asked: null, release: null, read: null, sleeveShot: null, typing: false,
  condShots: [], condition: null, busy: ''
};

/* ---------------- Discogs (public, no token) ---------------- */
let queue = Promise.resolve();
function dg(path) {                              // serialised, ~3/sec, well inside 25/min
  const run = async () => {
    const r = await fetch('https://api.discogs.com' + path);
    if (r.status === 429) throw new Error('Discogs is rate-limiting — wait a minute and retry.');
    if (!r.ok) throw new Error('Discogs returned ' + r.status);
    await new Promise(z => setTimeout(z, 320));
    return r.json();
  };
  queue = queue.then(run, run);
  return queue;
}

/* ---------------- Claude ---------------- */
async function ask(content) {
  const key = (LS.getItem('anthKey') || '').trim();
  if (!key) throw new Error('Add your Anthropic API key in settings (top right).');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': key,
               'anthropic-version': '2023-06-01',
               'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-opus-5', max_tokens: 16000,
                           thinking: { type: 'adaptive' },
                           messages: [{ role: 'user', content }] })
  });
  const j = await r.json();
  if (j.type === 'error') throw new Error(j.error.message);
  const text = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('Unexpected reply: ' + text.slice(0, 180));
  return JSON.parse(m[0]);
}
const img = b => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b } });

/* ---------------- camera ---------------- */
function shrink(file) {
  return new Promise((res, rej) => {
    if (!file || !file.size) return rej(new Error('That photo came through empty. Try again.'));
    if (file.size > 40 * 1024 * 1024) return rej(new Error('That photo is very large. Try again at a lower resolution.'));
    let done = false;
    const finish = fn => (...a) => { if (!done) { done = true; clearTimeout(timer); fn(...a); } };
    const ok = finish(res), no = finish(rej);
    // some pictures neither load nor error — a HEIC on a browser that cannot decode
    // it, or a corrupt file — so never wait on them indefinitely
    const timer = setTimeout(() => no(new Error(
      'That photo could not be opened. If it is a HEIC from an iPhone library, take a fresh photo with the camera button instead.'
    )), 20000);
    const i = new Image(), rd = new FileReader();
    rd.onerror = () => no(new Error('Could not read that file.'));
    rd.onload = () => { i.src = rd.result; };
    i.onerror = () => no(new Error('That file is not an image the browser can open.'));
    i.onload = () => {
      try {
        if (!i.width || !i.height) return no(new Error('That photo has no dimensions.'));
        const M = 1500, sc = Math.min(1, M / Math.max(i.width, i.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(i.width * sc));
        c.height = Math.max(1, Math.round(i.height * sc));
        c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
        const d = c.toDataURL('image/jpeg', 0.85).split(',')[1];
        if (!d) return no(new Error('Could not process that photo.'));
        ok(d);
      } catch (e) { no(new Error('Could not process that photo: ' + e.message)); }
    };
    try { rd.readAsDataURL(file); } catch (e) { no(new Error('Could not read that file.')); }
  });
}
async function addShots(input, bucket, max) {
  const files = [...input.files]; input.value = '';
  for (const f of files) {
    if (S[bucket].length >= max) break;
    try { S[bucket].push(await shrink(f)); }
    catch (e) { S.error = e.message; }
  }
  render();
}

/* ---------------- nav ---------------- */
function go(screen, keep) { if (S.screen === 'scan' && screen !== 'scan') stopLive();
  if (!keep) S.stack.push(S.screen); S.screen = screen; S.busy=''; window.scrollTo(0,0); render(); }
function back() { if (S.screen === 'scan') stopLive();
  S.screen = S.stack.pop() || 'search'; S.busy=''; render(); }
$('#back').onclick = back;
$('#gear').onclick = () => go('settings');

function fail(e) { S.busy = ''; S.error = (e && e.message) || String(e); render(); }
function busy(t) { S.busy = t; S.error = ''; render(); }

/* ---------------- tally ---------------- */
const rows = () => JSON.parse(LS.getItem('rows') || '[]');
function logResult(ok) {
  const r = rows();
  r.push({ when: new Date().toISOString(), release: S.release ? S.release.id : null,
           catno: S.release ? S.release.catno : '', conf: S.match ? S.match.confidence : null,
           asked: !!S.asked, correct: ok,
           transcription: S.match ? S.match.transcription : '',
           grade: S.condition ? S.condition.media_grade_range : '' });
  LS.setItem('rows', JSON.stringify(r));
  reset(); go('search', true);
}
function reset() {
  Object.assign(S, { demo: false, read: null, sleeveShot: null, typing: false, shots: [], match: null, asked: null, release: null,
                     condShots: [], condition: null, candidates: [], versions: [],
                     album: null, country: '', error: '' });
  S.stack = [];
}
</script>

<script>
'use strict';
/* ================= actions ================= */

async function doSearch(q) {
  if (!q.trim()) return;
  busy('Searching Discogs…');
  try {
    const j = await dg('/database/search?type=master&per_page=12&q=' + encodeURIComponent(q.trim()));
    S.results = (j.results || []).map(r => ({ id: r.id, title: r.title, year: r.year, thumb: r.thumb, country: r.country }));
    S.busy = '';
    if (!S.results.length) S.error = 'Nothing found. Try the artist and album title.';
    render();
  } catch (e) { fail(e); }
}

async function pickAlbum(a) {
  S.album = a; S.versions = []; S.candidates = [];
  S.country = (S.read && S.read.country) || '';      // the sleeve usually says where it was made
  go('narrow');
  busy('Loading every version…');
  try {
    let page = 1, pages = 1;
    while (page <= pages && page <= 3) {
      const v = await dg('/masters/' + a.id + '/versions?per_page=100&page=' + page);
      pages = v.pagination.pages; S.versions = S.versions.concat(v.versions || []); page++;
    }
    S.busy = ''; render();
  } catch (e) { fail(e); }
}

const FMT = { vinyl: ['Vinyl'], disc: ['Vinyl', 'CD'], all: null };
const owned = v => { try { return v.stats.community.in_collection | 0; } catch (e) { return 0; } };

function shortlist() {
  const want = FMT[S.fmt];
  let l = S.versions.slice();
  if (S.country) l = l.filter(v => v.country === S.country);
  if (want) l = l.filter(v => (v.major_formats || []).some(f => want.includes(f)));
  l.sort((a, b) => owned(b) - owned(a));
  return l;
}

let loadToken = 0;
async function loadRunouts() {
  const me = ++loadToken;
  const list = shortlist().slice(0, S.cap);
  S.candidates = [];
  if (!list.length) { S.error = 'No versions match that filter.'; return render(); }
  busy('Reading the runouts on file… 0 of ' + list.length);
  for (const v of list) {
    if (me !== loadToken) return;
    try {
      const rel = await dg('/releases/' + v.id);
      S.candidates.push({
        id: v.id, catno: v.catno, format: v.format, country: v.country, year: v.released,
        label: v.label, owned: owned(v), thumb: v.thumb,
        lowest: rel.lowest_price, forSale: rel.num_for_sale,
        have: rel.community && rel.community.have, want: rel.community && rel.community.want,
        cover: (rel.images && rel.images[0] && (rel.images[0].uri150 || rel.images[0].uri)) || v.thumb,
        runouts: (rel.identifiers || [])
          .filter(i => /matrix|runout/i.test(i.type || ''))
          .filter(i => !/label/i.test(i.description || ''))
          .map(i => ({ v: i.value, d: i.description || '' }))
      });
    } catch (e) { /* skip a bad one rather than stall the run */ }
    if (me !== loadToken) return;
    S.busy = 'Reading the runouts on file… ' + S.candidates.length + ' of ' + list.length;
    render();
  }
  if (me !== loadToken) return;
  S.busy = '';
  const withR = S.candidates.filter(c => c.runouts.length).length;
  if (withR === 0) S.error = 'None of these has a runout recorded, so there is nothing to match a photo against. This is the 56% gap — you can still list it by hand, and a scan would be a genuine contribution.';
  else if (withR === 1) S.error = 'Only one of these has a runout on file, so a photo cannot separate them.';
  render();
}

/* ================= live scanner =================
   A live feed with a checklist. Frames are graded on-device for sharpness so a
   model read is only spent when the picture is actually worth reading. */
const STEPS = [
  { key:'front',  label:'Sleeve front', shape:'sq',
    hint:'Fill the frame with the front cover.' },
  { key:'back',   label:'Sleeve back',  shape:'sq',
    hint:'Show the back — this is where the catalogue number and barcode are.' },
  { key:'runout', label:'Runout matrix', shape:'ring',
    hint:'Torch on. Tilt the record so the light skims across the dead wax.' }
];
const L = {                      // live-scanner runtime (not part of the saved state)
  stream:null, track:null, video:null, raf:0, timer:0,
  step:0, samples:0, lastSample:0, reading:false, sharp:0, torch:false,
  frames:{}, checks:{ front:null, back:null, catno:null, runout:null }, msg:''
};

async function startLive() {
  S.error = ''; go('scan');
  try {
    L.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } },
      audio: false
    });
  } catch (e) {
    S.error = 'The camera could not be opened (' + (e.name || 'unknown') + '). On iPhone this needs Safari and a tap to allow access. You can still photograph each part instead.';
    S.screen = 'capture'; return render();
  }
  L.track = L.stream.getVideoTracks()[0];
  L.step = 0; L.samples = 0; L.frames = {}; L.msg = ''; L.best = 0; L.stepStart = performance.now();
  L.checks = { front:null, back:null, catno:null, runout:null };
  render();
  const v = $('#feed');
  if (v) { v.srcObject = L.stream; v.play().catch(()=>{}); }
  loop();
}

function stopLive() {
  cancelAnimationFrame(L.raf); clearInterval(L.timer); clearTimeout(L.timer);
  if (L.stream) L.stream.getTracks().forEach(t => t.stop());
  L.stream = null; L.track = null; L.torch = false;
}

async function toggleTorch() {
  if (!L.track) return;
  try {
    const caps = L.track.getCapabilities ? L.track.getCapabilities() : {};
    if (!caps.torch) { L.msg = 'This browser will not let a web page control the torch — turn it on from the Control Centre and come back.'; return render(); }
    L.torch = !L.torch;
    await L.track.applyConstraints({ advanced: [{ torch: L.torch }] });
    render();
  } catch (e) { L.msg = 'Could not switch the torch on.'; render(); }
}

/* how sharp is the current frame? cheap on-device gate before spending a read */
function sharpness(v) {
  const w = 140, h = Math.round(w * (v.videoHeight || 3) / (v.videoWidth || 4));
  const c = sharpness.c || (sharpness.c = document.createElement('canvas'));
  c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(v, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data;
  let sum = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = (y * w + x) * 4;
    const p = d[i] * .299 + d[i+1] * .587 + d[i+2] * .114;
    const r = d[i+4] * .299 + d[i+5] * .587 + d[i+6] * .114;
    const b = d[i + w*4] * .299 + d[i + w*4+1] * .587 + d[i + w*4+2] * .114;
    sum += Math.abs(p - r) + Math.abs(p - b); n++;
  }
  return n ? sum / n : 0;
}

function grabFrame(max) {
  const v = L.video || $('#feed');
  if (!v || !v.videoWidth) return null;
  const sc = Math.min(1, (max || 1500) / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.85).split(',')[1];
}

const SHARP_FLOOR = 2.2;        // anything below this is a black or hopeless frame
const COOLDOWN    = 2600;       // ms between reads, so a live feed cannot run away with cost
const MAX_TRIES   = 5;          // per step, then it asks for a manual shot
const PATIENCE    = 7000;       // if nothing has looked good for this long, read anyway

// The gate is relative, not absolute: what counts as "sharp" depends on the
// camera, the record and the light, so it learns the best it has seen on this
// step and fires near it. A fixed threshold set blind would either fire on mush
// or — worse — sit there doing nothing at all.
function gateOpen(now) {
  if (L.sharp < SHARP_FLOOR) return false;
  L.best = Math.max(L.best || 0, L.sharp);
  if (now - (L.stepStart || now) > PATIENCE) return true;   // never just sit there
  return L.sharp >= Math.max(SHARP_FLOOR, L.best * 0.8);
}

function loop() {
  clearInterval(L.timer);
  L.timer = setInterval(tick, 250);   // an interval, not rAF: rAF stops in a
  tick();                             // background tab and the scanner would stall
}

function tick() {
  const v = L.video || $('#feed');
  if (!v || !v.videoWidth) return;
  L.video = v;
  L.sharp = sharpness(v);
  const now = performance.now();
  const bar = $('#sharpbar');
  if (bar) bar.style.width = Math.min(100, L.sharp / Math.max(4, (L.best || 4)) * 100) + '%';
  const ret = $('#ret'); if (ret) ret.classList.toggle('on', gateOpen(now));
  if (L.reading || L.step >= STEPS.length || L.samples >= MAX_TRIES) return;
  if (now - L.lastSample < COOLDOWN) return;
  if (!gateOpen(now)) return;
  L.lastSample = now; readStep();
}

async function readStep() {
  const step = STEPS[L.step]; if (!step) return;
  const b = grabFrame(); if (!b) return;
  L.reading = true; L.samples++; L.msg = ''; render();
  try {
    const a = await ask([img(b), { type: 'text', text: PROMPTS[step.key] }]);
    if (a.usable) {
      L.frames[step.key] = b;
      if (step.key === 'front')  { L.checks.front  = [a.artist, a.title].filter(Boolean).join(' — ') || 'cover captured'; }
      if (step.key === 'back')   { L.checks.back   = a.country ? 'made in ' + a.country : 'back captured';
                                   if (a.catno || a.barcode) L.checks.catno = a.catno || ('barcode ' + a.barcode); }
      if (step.key === 'runout') { L.checks.runout = a.reading || 'runout captured'; }
      S.read = Object.assign({}, S.read, {
        artist: a.artist || (S.read||{}).artist, title: a.title || (S.read||{}).title,
        catno: a.catno || (S.read||{}).catno, barcode: a.barcode || (S.read||{}).barcode,
        country: a.country || (S.read||{}).country
      });
      if (step.key === 'runout') S.shots = [b];
      L.step++; L.samples = 0; L.msg = ''; L.best = 0; L.stepStart = performance.now();
      if (L.step >= STEPS.length) return finishLive();
      // the album can be looked up while the user turns the record over
      if (step.key === 'back') prefetchAlbum();
    } else {
      L.msg = a.why || 'Not readable yet — move a little.';
    }
  } catch (e) {
    L.msg = e.message; L.samples = MAX_TRIES;      // stop burning reads on a broken key
  }
  L.reading = false; render();
}

const PROMPTS = {
  front:
`This is a live camera frame that should show the FRONT of a record sleeve.
Decide only whether it is good enough to use: in frame, in focus, not badly glared.
If it is, name the album if you recognise the artwork.
JSON only: {"usable":<bool>,"artist":null,"title":null,"why":"if not usable, what to change in under 10 words"}`,
  back:
`This is a live camera frame that should show the BACK of a record sleeve.
Read only what is genuinely legible: catalogue number (a short code like "SHVL 804", not the barcode), barcode digits, country of manufacture ("Made in England" means UK), artist, title.
Set usable true only if you got a catalogue number OR a barcode.
JSON only: {"usable":<bool>,"catno":null,"barcode":null,"country":null,"artist":null,"title":null,"why":"if not usable, what to change in under 10 words"}`,
  runout:
`This is a live camera frame that should show the RUNOUT MATRIX — the code stamped or etched into the smooth dead wax between the last groove and the label of a vinyl record.
Set usable true ONLY if you can read actual characters. Transcribe exactly what you see, using ? for characters you cannot make out. Do not guess and do not complete it from memory.
JSON only: {"usable":<bool>,"reading":"the characters, or empty","why":"if not usable, what to change in under 10 words — e.g. lower the light angle"}`
};

async function prefetchAlbum() {
  try {
    const r = S.read || {};
    if (r.barcode) {
      const digits = String(r.barcode).replace(/\D/g,'');
      if (digits.length >= 8) {
        const j = await dg('/database/search?per_page=20&barcode=' + encodeURIComponent(digits));
        const hits = (j.results||[]).filter(x => x.type === 'release');
        if (hits.length) { L.barcodeHits = hits; return; }
      }
    }
    const q = [r.artist, r.title].filter(Boolean).join(' ');
    if (!q) return;
    const j = await dg('/database/search?type=master&per_page=6&q=' + encodeURIComponent(q));
    L.masters = (j.results||[]).map(x => ({ id:x.id, title:x.title, year:x.year, thumb:x.thumb, country:x.country }));
  } catch (e) {}
}

async function finishLive() {
  L.msg = 'Everything captured.'; render();
  stopLive();
  if (L.barcodeHits) return fromBarcode(L.barcodeHits, S.read || {});
  if (L.masters && L.masters.length) {
    S.results = L.masters;
    if (L.masters.length === 1) return pickAlbum(L.masters[0]);
    S.screen = 'search'; S.stack = []; return render();
  }
  await prefetchAlbum();
  if (L.barcodeHits) return fromBarcode(L.barcodeHits, S.read || {});
  if (L.masters && L.masters.length) { S.results = L.masters; S.screen='search'; S.stack=[]; return render(); }
  S.error = 'Captured everything, but could not find the album from what was readable. Type the name instead.';
  S.screen = 'search'; S.stack = []; render();
}

/* ---- scan the sleeve to find the record ---- */
async function scanSleeve(file) {
  busy('Looking at the sleeve…');
  try {
    const b = await shrink(file);
    S.sleeveShot = b;
    const prompt =
`This photograph is of a record sleeve — it may be the front or the back.

Do two separate things and do not mix them up:
1. TRANSCRIBE any text you can actually read: artist, title, catalogue number, barcode digits, country of manufacture ("Made in..."), year, label name.
2. IDENTIFY the album from the artwork if you recognise it.

Rules:
- Only report text you can genuinely read. Use null for anything you cannot.
- The catalogue number is usually on the back and the spine, and on the labels. It is a short code like "SHVL 804" or "PFRLP8", not a barcode.
- Country: give the plain country name as a record catalogue would ("UK", "US", "Germany", "Japan"). "Made in England" means UK.
- If the sleeve is not a record sleeve at all, set not_a_record to true.

Reply with JSON only:
{"artist":"...","title":"...","catno":null,"barcode":null,"country":null,"year":null,"label":null,
 "recognised_from_artwork":<true|false>,"not_a_record":<true|false>,"confidence":<0-100>,"read":"what you could see"}`;
    const a = await ask([img(b), { type: 'text', text: prompt }]);
    S.read = a;
    if (a.not_a_record) { S.busy=''; S.error = 'That does not look like a record sleeve. Try again, or type the album name.'; return render(); }

    // barcode is the most precise handle, so try it first
    if (a.barcode) {
      const digits = String(a.barcode).replace(/\D/g, '');
      if (digits.length >= 8) {
        S.busy = 'Looking up the barcode…';
        render();
        const j = await dg('/database/search?per_page=20&barcode=' + encodeURIComponent(digits));
        const hits = (j.results || []).filter(r => r.type === 'release');
        if (hits.length) { return fromBarcode(hits, a); }
      }
    }
    // otherwise search by what it read, or what it recognised
    const q = [a.artist, a.title].filter(Boolean).join(' ');
    if (!q) { S.busy=''; S.error = 'Could not read enough from that photo. Try the back of the sleeve, or type the album name.'; return render(); }
    S.query = q;
    S.busy = 'Searching for “' + q + '”…';
    render();
    const j = await dg('/database/search?type=master&per_page=12&q=' + encodeURIComponent(q));
    S.results = (j.results || []).map(r => ({ id: r.id, title: r.title, year: r.year, thumb: r.thumb, country: r.country }));
    S.busy = '';
    if (!S.results.length) { S.error = 'Nothing matched “' + q + '”. Try the back of the sleeve, or type it in.'; return render(); }
    if (S.results.length === 1) return pickAlbum(S.results[0]);
    render();
  } catch (e) { fail(e); }
}

// a barcode narrowed it to specific releases rather than an album
async function fromBarcode(hits, read) {
  S.busy = 'Reading the pressings…';
  render();
  const out = [];
  for (const h of hits.slice(0, 8)) {
    try {
      const rel = await dg('/releases/' + h.id);
      out.push({
        id: h.id, catno: (rel.labels && rel.labels[0] && rel.labels[0].catno) || read.catno || '',
        format: (rel.formats || []).map(f => f.name).join(', '), country: rel.country, year: rel.year,
        label: (rel.labels && rel.labels[0] && rel.labels[0].name) || '',
        owned: rel.community && rel.community.have, lowest: rel.lowest_price, forSale: rel.num_for_sale,
        have: rel.community && rel.community.have, want: rel.community && rel.community.want,
        cover: (rel.images && rel.images[0] && (rel.images[0].uri150 || rel.images[0].uri)) || h.thumb || '',
        master: rel.master_id,
        runouts: (rel.identifiers || []).filter(i => /matrix|runout/i.test(i.type || ''))
                   .filter(i => !/label/i.test(i.description || ''))
                   .map(i => ({ v: i.value, d: i.description || '' }))
      });
    } catch (e) {}
  }
  S.candidates = out;
  S.album = { id: out[0] && out[0].master, title: [read.artist, read.title].filter(Boolean).join(' - ') };
  S.busy = '';
  if (out.length === 1) {                       // the barcode settled it on its own
    S.release = out[0];
    S.match = { transcription: 'barcode ' + read.barcode, top: 1, confidence: 92,
                margin: 'The barcode matches exactly one release, so there is nothing to separate.',
                deciding_character: '', next_photo: '',
                reasoning: 'Identified from the barcode rather than the runout — no runout photograph needed.' };
    S.stack = ['search']; return go('result', true);
  }
  S.stack = ['search']; go('narrow', true);
  render();
}

/* ---- identify ---- */
function candidateList(list) {
  return list.map((c, i) =>
    '[' + (i + 1) + '] release ' + c.id + ' — ' + (c.catno || 'no cat#') + ' · ' +
    [c.format, c.country, c.year].filter(Boolean).join(' · ') +
    (c.owned ? ' · ' + c.owned.toLocaleString() + ' copies owned' : '') +
    '\n      runouts on file: ' + c.runouts.map(r => '"' + r.v + '"' + (r.d ? ' (' + r.d + ')' : '')).join(' | ')
  ).join('\n');
}
const RULES =
`Rules that matter:
- A release with more recorded variants is only better documented, not more likely. Judge by fit, never by how many strings a candidate has.
- "Copies owned" is weak background only. It must never decide the answer.
- Candidates often differ by ONE character (A-2 vs A-3; the digit 1 vs the letter I). If you cannot read the deciding character confidently, say so and lower your confidence. Being honestly unsure is the correct answer.`;

async function identify() {
  if (!S.shots.length) { S.error = 'Take at least one photo of the runout.'; return render(); }
  const usable = S.candidates.filter(c => c.runouts.length);
  busy('Reading the runout…');
  try {
    const prompt =
`These photographs show the runout matrix (the code stamped into the dead wax) of one vinyl record. Below are the only releases it can be, with the runouts recorded for each.

${candidateList(usable)}

${RULES}

Do this in order:
1. Transcribe what you can actually read, character by character. Use ? for anything you cannot read.
2. Rank the candidates. The answer must be one of the numbers above, or null for "none of these".
3. Give a confidence 0-100 for the top choice.
4. Say how far ahead it is over the runner-up, and whether that gap is a single character.
5. Say which ONE extra photograph would most reduce the remaining doubt.

Reply with JSON only:
{"transcription":"...","top":<number|null>,"confidence":<0-100>,"runner_up":<number|null>,"margin":"...","deciding_character":"...","next_photo":"...","reasoning":"one or two sentences"}`;
    const a = await ask([...S.shots.map(img), { type: 'text', text: prompt }]);
    S.match = a; S.release = a.top ? usable[a.top - 1] : null;
    S.busy = ''; go('result');
  } catch (e) { fail(e); }
}

async function disambiguate() {
  const usable = S.candidates.filter(c => c.runouts.length);
  busy('Looking again with the extra photo…');
  try {
    const prompt =
`Same record as before. The first photographs were of the runout matrix; the LAST photograph is the extra shot that was requested: "${S.match.next_photo}".

Your earlier reading of the runout was: "${S.match.transcription}"

Candidates:
${candidateList(usable)}

${RULES}

Use the new photograph together with the runout reading. If the new photograph shows a feature (a label design, rim text, a second runout) that separates the candidates, say which and why.

Reply with JSON only:
{"transcription":"...","top":<number|null>,"confidence":<0-100>,"runner_up":<number|null>,"margin":"...","deciding_character":"...","what_the_extra_photo_showed":"...","next_photo":"...","reasoning":"..."}`;
    const a = await ask([...S.shots.map(img), ...S.asked.map(img), { type: 'text', text: prompt }]);
    S.match = a; S.release = a.top ? usable[a.top - 1] : null;
    S.busy = ''; render();
  } catch (e) { fail(e); }
}

/* ---- saved example: real releases from the API, a saved verdict ---- */
async function loadExample() {
  busy('Loading a saved example…');
  try {
    const ids = [1873013, 2655031];
    const out = [];
    for (const id of ids) {
      const rel = await dg('/releases/' + id);
      out.push({
        id, catno: (rel.labels && rel.labels[0] && rel.labels[0].catno) || 'SHVL 804',
        format: 'LP, Album' + (id === 1873013 ? ', Gatefold' : ', 2nd'),
        country: rel.country, year: rel.year, label: (rel.labels && rel.labels[0] && rel.labels[0].name) || 'Harvest',
        owned: rel.community && rel.community.have, lowest: rel.lowest_price, forSale: rel.num_for_sale,
        have: rel.community && rel.community.have, want: rel.community && rel.community.want,
        cover: (rel.images && rel.images[0] && (rel.images[0].uri150 || rel.images[0].uri)) || '',
        runouts: (rel.identifiers || []).filter(i => /matrix|runout/i.test(i.type || ''))
                   .filter(i => !/label/i.test(i.description || ''))
                   .map(i => ({ v: i.value, d: i.description || '' }))
      });
    }
    S.demo = true;
    S.album = { id: 10362, title: 'Pink Floyd - The Dark Side Of The Moon', year: '1973' };
    S.candidates = out;
    S.release = out[0];
    S.match = {
      transcription: 'SHVL 804 A-2 G 1',
      top: 1, confidence: 96, runner_up: 2,
      margin: 'The stamped core SHVL 804 A- matches both. The deciding character is the stamper digit: 2 for the first pressing, 3 for the second issue. One character apart.',
      deciding_character: 'the digit after A- (2 rather than 3)',
      what_the_extra_photo_showed: 'A solid light-blue prism on the centre label. The second issue is documented with an empty outline prism, so this rules it out independently of the runout.',
      next_photo: '',
      reasoning: 'Runout and label agree on the 1973 first pressing. Either alone would have been a thin margin; together they are not.'
    };
    S.condition = {
      defects: [
        { what: 'scuff', where: 'side A, outer third', severity: 'light', audible_risk: 'possible' },
        { what: 'hairline', where: 'side B, mid', severity: 'light', audible_risk: 'possible' },
        { what: 'ring wear', where: 'sleeve front, lower right', severity: 'light', audible_risk: 'none' }
      ],
      sealed: false, media_grade_range: 'VG+ or VG', sleeve_grade_range: 'VG+', confidence: 70,
      play_test_advised: true,
      buyer_note: 'Two light scuffs to side A and one hairline to side B, visible under a light but not felt. Light ring wear to the sleeve front.',
      caveat: 'Surface noise, crackle and skipping cannot be judged from photographs — only a play-test can settle those.'
    };
    S.busy = ''; S.stack = ['search']; go('result', true);
  } catch (e) { fail(e); }
}

/* ---- condition ---- */
async function grade() {
  if (!S.condShots.length) { S.error = 'Take at least one photo of the record surface.'; return render(); }
  busy('Looking for marks…');
  try {
    const prompt =
`These photographs show a second-hand vinyl record and/or its sleeve, for condition grading on the Discogs (Goldmine) scale: Mint, Near Mint, VG+, VG, G+, G, Fair, Poor.

Report only what you can actually see. Do not infer.

Hard limits you must respect:
- You cannot hear the record. The lower grades are defined by AUDIBLE damage — surface noise, crackle, skipping. Never claim to judge those.
- Give a grade RANGE, not a single grade, whenever the marks put it near a boundary.
- The seller makes the final call. Your output is a suggestion and a draft, never a verdict.

Reply with JSON only:
{"defects":[{"what":"scuff|scratch|hairline|mark|warp|ring wear|seam split|writing|sticker|other","where":"e.g. side A, outer third","severity":"light|moderate|heavy","audible_risk":"none|possible|likely"}],
 "sealed":<true|false>,
 "media_grade_range":"e.g. VG+ or VG",
 "sleeve_grade_range":"e.g. VG+",
 "confidence":<0-100>,
 "play_test_advised":<true|false>,
 "buyer_note":"one or two plain sentences a seller could paste into the listing",
 "caveat":"what you could not judge from the photographs"}`;
    S.condition = await ask([...S.condShots.map(img), { type: 'text', text: prompt }]);
    S.busy = ''; go('summary');
  } catch (e) { fail(e); }
}
</script>

<script>
'use strict';
/* ================= render ================= */
const TITLES = { search:'Runout', scan:'Scanning', capture1:'Photograph the sleeve', narrow:'Narrow it down', capture:'Photograph the runout',
                 result:'Identify', condition:'Condition', summary:'Ready to list', settings:'Settings' };

function relCard(c, cls) {
  return `<div class="rel">
    ${c.cover ? `<img src="${esc(c.cover)}" alt="" referrerpolicy="no-referrer">` : '<img alt="">'}
    <div class="m">
      <div class="a">${esc(S.album ? S.album.title.split(' - ')[0] : '')}</div>
      <div class="b">${esc(c.catno || 'No catalogue number')}</div>
      <div class="c">${esc([c.format, c.country, c.year].filter(Boolean).join(' · '))}</div>
      ${c.owned ? `<div class="c">${c.owned.toLocaleString()} copies owned</div>` : ''}
    </div></div>`;
}

function render() {
  $('#title').textContent = TITLES[S.screen] || 'Runout';
  $('#back').classList.toggle('hidden', !S.stack.length || S.screen === 'search');
  const m = $('#main'); m.innerHTML = '';
  const add = h => m.appendChild(typeof h === 'string' ? el(h) : h);

  if (S.error) add(`<div class="banner bad">${esc(S.error)}</div>`);
  if (S.demo && (S.screen === 'result' || S.screen === 'summary'))
    add(`<div class="banner warn"><b>Worked example.</b> The releases, runouts and prices below are live from Discogs. The reading and the grading are a saved result from a real scan, not from a photo you took.</div>`);
  if (S.busy) add(`<div class="busy"><span class="spin"></span>${esc(S.busy)}</div>`);

  /* ---- search ---- */
  if (S.screen === 'search') {
    add(`<h1>Point it at a record.</h1>`);
    add(`<p class="note">Photograph the sleeve and the app works out the album, then every pressing of it, then which one you are holding. The <b>back</b> of the sleeve gives it most to go on.</p>`);
    const live = el(`<button class="primary" style="padding:20px 16px;font-size:17px">&#128247;&nbsp; Start scanning</button>`);
    live.onclick = startLive; add(live);
    add(`<div class="checks">
      <div><b></b>Sleeve front</div><div><b></b>Sleeve back</div>
      <div><b></b>Catalogue number</div><div><b></b>Runout matrix</div></div>`);
    add(`<p class="note">The camera stays live and ticks each one off as it gets what it needs. Four things, in that order.</p>`);
    const one = el(`<button class="ghost">Photograph a sleeve instead</button>`);
    one.onclick = () => go('capture1'); add(one);
    if (S.sleeveShot && S.read) {
      const r = S.read;
      add(`<div class="card tonal"><div class="eyebrow">Read from the sleeve</div>
        ${r.artist||r.title ? `<div class="t" style="margin-top:3px">${esc([r.artist,r.title].filter(Boolean).join(' — '))}</div>` : ''}
        <div class="pills" style="margin-top:6px">
          ${r.catno?`<span class="pill brand">${esc(r.catno)}</span>`:''}
          ${r.country?`<span class="pill">${esc(r.country)}</span>`:''}
          ${r.year?`<span class="pill">${esc(r.year)}</span>`:''}
          ${r.barcode?`<span class="pill blue">barcode</span>`:''}
          ${r.recognised_from_artwork?`<span class="pill">from the artwork</span>`:''}
        </div></div>`);
    }
    const tog = el(`<button class="ghost">${S.typing ? 'Hide the search box' : 'Or type the album name'}</button>`);
    tog.onclick = () => { S.typing = !S.typing; render(); }; add(tog);
    if (S.typing) {
      const f = el(`<form class="stack"><input id="q" type="search" placeholder="Artist and album title" value="${esc(S.query)}" enterkeyhint="search">
        <button class="primary" type="submit">Search</button></form>`);
      f.onsubmit = e => { e.preventDefault(); S.query = $('#q').value; doSearch(S.query); };
      add(f);
    }
    if (S.results.length) {
      add(`<div class="eyebrow" style="margin-top:6px">Results</div>`);
      S.results.forEach(r => {
        const c = el(`<div class="card tap"><div class="rel">
          ${r.thumb ? `<img src="${esc(r.thumb)}" alt="" referrerpolicy="no-referrer">` : '<img alt="">'}
          <div class="m"><div class="b">${esc(r.title)}</div>
          <div class="c">${esc([r.year, r.country].filter(Boolean).join(' · '))}</div></div></div></div>`);
        c.onclick = () => pickAlbum(r); add(c);
      });
    }
    const dx = el(`<button class="ghost">See a worked example</button>`);
    dx.onclick = loadExample; add(dx);
    const t = rows();
    if (t.length) {
      const ok = t.filter(x => x.correct).length;
      add(`<div class="stats" style="margin-top:8px">
        <div><span class="k">Scanned</span><span class="n">${t.length}</span></div>
        <div><span class="k">Right</span><span class="n">${ok}</span></div>
        <div><span class="k">Top-1</span><span class="n">${Math.round(ok / t.length * 100)}%</span></div></div>`);
    }
  }

  /* ---- narrow ---- */
  if (S.screen === 'narrow') {
    add(`<h1>${esc(S.album ? S.album.title : '')}</h1>`);
    const total = S.versions.length, sl = shortlist().length;
    add(`<div class="pills"><span class="pill">${total} versions</span>
      <span class="pill ${sl < total ? 'brand' : ''}">${sl} after filtering</span></div>`);
    const countries = [...new Set(S.versions.map(v => v.country).filter(Boolean))]
      .map(c => [c, S.versions.filter(v => v.country === c).length]).sort((a, b) => b[1] - a[1]);
    const ctl = el(`<div class="row">
      <select id="ct"><option value="">Any country</option>${countries.map(([c, n]) =>
        `<option value="${esc(c)}"${c === S.country ? ' selected' : ''}>${esc(c)} (${n})</option>`).join('')}</select>
      <select id="fm">
        <option value="vinyl"${S.fmt==='vinyl'?' selected':''}>Vinyl</option>
        <option value="disc"${S.fmt==='disc'?' selected':''}>Vinyl + CD</option>
        <option value="all"${S.fmt==='all'?' selected':''}>Any format</option></select></div>`);
    add(ctl);
    $('#ct').onchange = e => { S.country = e.target.value; render(); };
    $('#fm').onchange = e => { S.fmt = e.target.value; render(); };
    if (S.read && (S.read.catno || S.read.country)) add(`<div class="banner info">From your sleeve photo: ${
      [S.read.catno ? '<b>' + esc(S.read.catno) + '</b>' : '', S.read.country ? 'made in ' + esc(S.read.country) : ''].filter(Boolean).join(' · ')
    }${S.country ? ' — country filter set for you.' : ''}</div>`);
    add(`<p class="note">Country is on the sleeve — &ldquo;Made in&hellip;&rdquo; — and it is the single most useful filter. ${sl > S.cap ? `Only the ${S.cap} most-owned will be checked.` : ''}</p>`);

    if (!S.candidates.length) {
      const b = el(`<button class="primary">Load the runouts on file</button>`);
      b.onclick = loadRunouts; add(b);
    } else {
      const withR = S.candidates.filter(c => c.runouts.length).length;
      add(`<div class="eyebrow" style="margin-top:4px">${withR} of ${S.candidates.length} have a runout recorded</div>`);
      S.candidates.forEach(c => add(`<div class="card ${c.runouts.length ? '' : 'mute'}">
        ${relCard(c)}
        ${c.runouts.length
          ? `<div class="mono" style="color:var(--ink2);margin-top:6px">${c.runouts.slice(0,2).map(r=>esc(r.v)).join('<br>')}${c.runouts.length>2?`<br>+ ${c.runouts.length-2} more`:''}</div>`
          : `<div class="s" style="margin-top:6px">No runout on file</div>`}</div>`));
      if (withR >= 2) {
        const s = el(`<div class="sticky"><button class="primary">Photograph the runout</button></div>`);
        s.firstElementChild.onclick = () => go('capture'); add(s);
      }
    }
  }

  /* ---- single-photo fallback ---- */
  if (S.screen === 'capture1') {
    add(`<h1>Photograph the sleeve</h1>`);
    add(`<p class="note">One photo, back of the sleeve for preference. Use this if the live camera will not open.</p>`);
    const lab = el(`<label class="file"><b>&#128247; Take a photo</b><span>front or back</span>
      <input type="file" accept="image/*" capture="environment"></label>`);
    lab.querySelector('input').onchange = e => { const f = e.target.files[0]; e.target.value=''; if (f) scanSleeve(f); };
    add(lab);
  }

  /* ---- live scan ---- */
  if (S.screen === 'scan') {
    const step = STEPS[L.step] || STEPS[STEPS.length - 1];
    const vp = el(`<div class="viewport">
      <video id="feed" playsinline autoplay muted></video>
      <div class="vp-overlay">
        <div id="ret" class="reticle ${step.shape}"></div>
        <div class="vp-top">
          <span class="vp-step">${esc(step.label)}</span>
          <span class="vp-live"><i></i>${L.reading ? 'reading' : 'live'}</span>
        </div>
        ${L.reading ? `<div class="vp-busy"><span class="spin"></span> reading the frame…</div>` : ''}
        <div class="vp-hint">${esc(L.msg || step.hint)}</div>
      </div></div>`);
    add(vp);
    const v = vp.querySelector('#feed');
    if (L.stream) { v.srcObject = L.stream; v.play().catch(()=>{}); L.video = v; }

    add(`<div class="meter"><i id="sharpbar" style="width:0%"></i></div>`);
    add(`<p class="note" style="margin-top:-4px">Focus. It reads a frame by itself once the picture is sharp enough — it will not waste a read on a blurred one.</p>`);

    const rowsHtml = [
      ['front',  'Sleeve front'],
      ['back',   'Sleeve back'],
      ['catno',  'Catalogue number'],
      ['runout', 'Runout matrix']
    ].map(([k, lbl]) => {
      const done = !!L.checks[k];
      const now  = !done && ((step.key === k) || (step.key === 'back' && k === 'catno'));
      return `<div class="${done ? 'done' : now ? 'now' : ''}"><b>${done ? '✓' : now ? '•' : ''}</b>${lbl}
        ${done ? `<span>${esc(String(L.checks[k]).slice(0, 46))}</span>` : now ? `<span>looking…</span>` : ''}</div>`;
    }).join('');
    add(`<div class="checks">${rowsHtml}</div>`);

    const ctl = el(`<div class="row" style="align-items:center">
      <button class="ghost" id="torch">${L.torch ? 'Torch off' : 'Torch on'}</button>
      <button class="ghost" id="manual">Read now</button>
      <button class="ghost" id="skip">Skip this</button></div>`);
    add(ctl);
    $('#torch').onclick = toggleTorch;
    $('#manual').onclick = () => { if (!L.reading) { L.lastSample = performance.now(); L.samples = 0; readStep(); } };
    $('#skip').onclick = () => { L.step++; L.samples = 0; L.msg = ''; L.best = 0; L.stepStart = performance.now();
      if (L.step >= STEPS.length) finishLive(); else render(); };
    if (L.samples >= MAX_TRIES) add(`<div class="banner warn">Five tries on this one without a clean read. Move the light, or tap <b>Skip this</b> and carry on — the runout is the only one that really matters.</div>`);
    add(`<button class="ghost" id="stopcam">Stop the camera</button>`);
    $('#stopcam').onclick = () => { stopLive(); S.screen = 'search'; S.stack = []; render(); };
  }

  /* ---- capture ---- */
  if (S.screen === 'capture') {
    add(`<h1>The runout matrix</h1>`);
    add(`<p class="note">The code stamped between the last groove and the label. <b>Torch on</b>, hold the record at a low angle to the light and take two or three from different angles — the etching only shows when the light rakes across it.</p>`);
    const lab = el(`<label class="file"><b>&#128247; Take a photo</b><span>up to 3 · more angles, better read</span>
      <input type="file" accept="image/*" capture="environment" multiple></label>`);
    lab.querySelector('input').onchange = e => addShots(e.target, 'shots', 3); add(lab);
    if (!(LS.getItem('anthKey') || '').trim()) {
      add(`<div class="banner info"><b>Reading a photo needs an Anthropic API key</b> — add one under the cog, top right. Everything up to this point works without one.</div>`);
    }
    const ex = el(`<button class="ghost">See a worked example instead</button>`);
    ex.onclick = loadExample; add(ex);
    if (S.shots.length) {
      const g = el(`<div class="shots"></div>`);
      S.shots.forEach((b, i) => {
        const f = el(`<figure><img src="data:image/jpeg;base64,${b}" alt=""><button aria-label="Remove">&times;</button></figure>`);
        f.querySelector('button').onclick = () => { S.shots.splice(i, 1); render(); }; g.appendChild(f);
      });
      add(g);
      const s = el(`<div class="sticky"><button class="primary">Identify the pressing</button></div>`);
      s.firstElementChild.onclick = identify; add(s);
    }
  }

  /* ---- result ---- */
  if (S.screen === 'result') {
    const a = S.match || {}, conf = a.confidence | 0;
    const tone = conf >= 85 ? 'brand' : conf >= 60 ? 'warn' : 'bad';
    if (S.release) {
      add(`<div class="card win">${relCard(S.release)}
        <div class="pills" style="margin-top:8px"><span class="pill ${tone}">${conf}% confident</span>
        ${S.asked ? '<span class="pill">2 rounds</span>' : ''}</div></div>`);
    } else {
      add(`<div class="card"><div class="t">No confident match</div>
        <div class="s">Which is a legitimate answer — the record may not be in the database, or the photo may not be readable.</div></div>`);
    }
    add(`<div class="card tonal"><div class="eyebrow">Read from your photo</div>
      <div class="mono" style="color:var(--ink);margin-top:4px">${esc(a.transcription || '—')}</div></div>`);
    add(`<div class="card tonal">
      <div class="s"><b>Margin</b> — ${esc(a.margin || '—')}</div>
      ${a.deciding_character ? `<div class="s"><b>Turns on</b> — ${esc(a.deciding_character)}</div>` : ''}
      ${a.what_the_extra_photo_showed ? `<div class="s"><b>The extra photo showed</b> — ${esc(a.what_the_extra_photo_showed)}</div>` : ''}
      ${a.reasoning ? `<div class="s" style="margin-top:4px">${esc(a.reasoning)}</div>` : ''}</div>`);

    if (conf < 85 && a.next_photo && !S.asked) {
      add(`<div class="banner warn"><b>One more photo would settle it.</b><br>${esc(a.next_photo)}</div>`);
      const lab = el(`<label class="file"><b>&#128247; Take that photo</b><span>${esc(a.next_photo)}</span>
        <input type="file" accept="image/*" capture="environment"></label>`);
      lab.querySelector('input').onchange = async e => {
        S.asked = []; for (const f of e.target.files) S.asked.push(await shrink(f));
        e.target.value = ''; disambiguate();
      };
      add(lab);
    }
    if (S.release) {
      const s = el(`<div class="sticky"><button class="ghost">Wrong one</button><button class="primary">Yes — grade it</button></div>`);
      s.children[0].onclick = () => { go('narrow'); };
      s.children[1].onclick = () => go('condition'); add(s);
    } else {
      const s = el(`<div class="sticky"><button class="ghost">Back</button><button class="primary">Log as a miss</button></div>`);
      s.children[0].onclick = back; s.children[1].onclick = () => logResult(false); add(s);
    }
  }

  /* ---- condition ---- */
  if (S.screen === 'condition') {
    add(`<h1>How does it look?</h1>`);
    add(`<p class="note">Photograph the playing surface under a low, raking light, and the sleeve if you want it graded too. The app spots the marks and drafts the note. <b>The grade stays yours.</b></p>`);
    const lab = el(`<label class="file"><b>&#128247; Media and sleeve</b><span>up to 4 photos</span>
      <input type="file" accept="image/*" capture="environment" multiple></label>`);
    lab.querySelector('input').onchange = e => addShots(e.target, 'condShots', 4); add(lab);
    if (S.condShots.length) {
      const g = el(`<div class="shots"></div>`);
      S.condShots.forEach((b, i) => {
        const f = el(`<figure><img src="data:image/jpeg;base64,${b}" alt=""><button aria-label="Remove">&times;</button></figure>`);
        f.querySelector('button').onclick = () => { S.condShots.splice(i, 1); render(); }; g.appendChild(f);
      });
      add(g);
    }
    const s = el(`<div class="sticky"><button class="ghost">Skip</button><button class="primary"${S.condShots.length?'':' disabled'}>Assess</button></div>`);
    s.children[0].onclick = () => go('summary');
    s.children[1].onclick = grade; add(s);
  }

  /* ---- summary ---- */
  if (S.screen === 'summary') {
    const c = S.condition, r = S.release;
    if (r) add(`<div class="card win">${relCard(r)}</div>`);
    if (r) add(`<div class="stats">
      <div><span class="k">For sale</span><span class="n">${r.forSale != null ? r.forSale : '—'}</span></div>
      <div><span class="k">From</span><span class="n">${r.lowest != null ? '£' + r.lowest : '—'}</span></div>
      <div><span class="k">Have</span><span class="n">${r.have != null ? r.have.toLocaleString() : '—'}</span></div></div>`);
    if (c) {
      add(`<div class="card"><div class="eyebrow">Suggested — yours to change</div>
        <div class="row" style="margin-top:6px">
          <div><div class="s">Media</div><div class="t" style="font-size:19px">${esc(c.media_grade_range || '—')}</div></div>
          <div><div class="s">Sleeve</div><div class="t" style="font-size:19px">${esc(c.sleeve_grade_range || '—')}</div></div>
        </div>
        ${c.play_test_advised ? `<div class="pill warn" style="align-self:flex-start;margin-top:8px">play-test to be sure</div>` : ''}
        ${c.sealed ? `<div class="pill brand" style="align-self:flex-start;margin-top:8px">looks sealed</div>` : ''}</div>`);
      if ((c.defects || []).length) add(`<div class="card tonal"><div class="eyebrow">What it saw</div>
        ${c.defects.map(d => `<div class="s" style="margin-top:3px">• <b>${esc(d.what)}</b> — ${esc(d.where)}${d.severity ? ', ' + esc(d.severity) : ''}${d.audible_risk && d.audible_risk !== 'none' ? ` <span style="color:var(--warn)">(${esc(d.audible_risk)} to be audible)</span>` : ''}</div>`).join('')}</div>`);
      add(`<div class="card"><div class="eyebrow">Draft note for the buyer</div>
        <textarea id="note">${esc(c.buyer_note || '')}</textarea>
        <div class="s">${esc(c.caveat || '')}</div></div>`);
    }
    const acts = el(`<div class="stack">
      <button class="primary" id="sell">List it on Discogs &nearr;</button>
      <div class="row"><button class="ghost" id="coll">Add to collection &nearr;</button><button class="ghost" id="copy">Copy details</button></div>
    </div>`);
    add(acts);
    $('#sell').onclick = () => r && window.open('https://www.discogs.com/sell/post/' + r.id, '_blank', 'noopener');
    $('#coll').onclick = () => r && window.open('https://www.discogs.com/release/' + r.id, '_blank', 'noopener');
    $('#copy').onclick = () => {
      const n = $('#note'); const txt = [
        r ? 'Release: https://www.discogs.com/release/' + r.id : '',
        r ? (r.catno || '') + ' · ' + [r.format, r.country, r.year].filter(Boolean).join(' · ') : '',
        c ? 'Media: ' + (c.media_grade_range || '') + '   Sleeve: ' + (c.sleeve_grade_range || '') : '',
        n ? n.value : ''].filter(Boolean).join('\n');
      navigator.clipboard.writeText(txt).then(() => { S.error=''; S.busy='Copied.'; render(); setTimeout(()=>{S.busy='';render();},1200); });
    };
    if (r && !r.runouts.length) add(`<div class="banner info"><b>This release had no runout on file.</b> Your photo is exactly what is missing — worth submitting as a contribution.</div>`);
    const s = el(`<div class="sticky"><button class="ghost">Wrong match</button><button class="primary">Right — next record</button></div>`);
    s.children[0].onclick = () => logResult(false);
    s.children[1].onclick = () => logResult(true); add(s);
  }

  /* ---- settings ---- */
  if (S.screen === 'settings') {
    add(`<h1>Settings</h1>`);
    const k = el(`<div class="card"><div class="eyebrow">Anthropic API key</div>
      <input id="key" type="password" placeholder="sk-ant-…" value="${esc(LS.getItem('anthKey') || '')}" autocomplete="off">
      <div class="s">Kept in this browser only and sent straight to api.anthropic.com. Fine for a personal trial; not how a shipped app would do it.</div></div>`);
    add(k);
    $('#key').onchange = e => LS.setItem('anthKey', e.target.value.trim());
    const t = rows();
    add(`<div class="card tonal"><div class="eyebrow">Trial results</div>
      <div class="s">${t.length} scans logged, ${t.filter(x=>x.correct).length} correct${t.length?` — ${Math.round(t.filter(x=>x.correct).length/t.length*100)}% top-1`:''}.</div></div>`);
    const b = el(`<div class="row"><button class="ghost" id="csv">Export CSV</button><button class="ghost" id="wipe">Clear results</button></div>`);
    add(b);
    $('#csv').onclick = () => {
      if (!t.length) { S.error = 'Nothing logged yet.'; return render(); }
      const head = 'when,release,catno,confidence,asked_second_photo,correct,grade,transcription';
      const body = t.map(x => [x.when, x.release, '"'+(x.catno||'')+'"', x.conf, x.asked, x.correct,
        '"'+(x.grade||'')+'"', '"'+(x.transcription||'').replace(/"/g,'""')+'"'].join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([head+'\n'+body], {type:'text/csv'}));
      const a = document.createElement('a'); a.href = url; a.download = 'runout-trial.csv'; a.click();
    };
    $('#wipe').onclick = () => { LS.removeItem('rows'); render(); };
    add(`<details><summary>What this demo does and does not do</summary><div>
      <div class="s"><b>Real:</b> every version, catalogue number, runout, price and cover comes live from the Discogs API. The identification and the condition read are real model calls on your photographs.</div>
      <div class="s"><b>Not real:</b> it cannot create the listing for you — that needs your Discogs login — so it hands off to the normal Discogs form with the right release already chosen.</div>
      <div class="s"><b>Deliberately conservative:</b> it suggests a grade range, never a single grade, and never claims to judge how a record sounds.</div></div></details>`);
  }
}

/* ---- boot ---- */
if ('serviceWorker' in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!reloading) { reloading = true; location.reload(); }   // a newer build took over
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => { reg.update(); setInterval(() => reg.update(), 60 * 60 * 1000); })
      .catch(() => {});
  });
}
render();
</script>
</html>
